name: Release Railroad Diagrams

# attaches the railroad diagrams of all grammars as a zip to a published GitHub release;
# a manual run attaches them to the release of an existing tag
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release; only tags that contain the railroadDiagrams Gradle task work'
        required: true

permissions:
  contents: write

jobs:
  diagrams:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate railroad diagrams
        run: ./gradlew railroadDiagrams
      - name: Attach the diagrams to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="goslin-railroad-diagrams-${TAG}.zip"
          (cd docs && zip -r -q "../${ZIP}" grammars)
          gh release upload "$TAG" "$ZIP" --clobber
