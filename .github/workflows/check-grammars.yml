# This is a basic workflow to help you get started with Actions

name: Check Grammars

# Controls when the workflow will run
on:
  # Triggers the workflow on push events for the master branch and on every pull request
  push:
    branches: [ master ]
  # every pull request, also those stacked on another branch
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Gradle Build Action
        uses: gradle/gradle-build-action@v3.5.0
        with:
          gradle-version: '7.2'
          arguments: build --continue # continue build on task errors to get overview of all tasks
      # Includes the AsciiDoctor GitHub Pages Action to convert adoc files to html and publish to gh-pages branch
      # publish only on a push to master or a manual run, never from a pull request
      - name: asciidoctor-ghpages
        if: github.event_name != 'pull_request'
        uses: manoelcampos/asciidoctor-ghpages-action@v2
        with:
          pdf_build: false
          # asciidoctor_params: --attribute=nofooter
          # adoc_file_ext: .ascii # default is .adoc
          # source_dir: docs/ # default is .
          # slides_build: true
          # pre_build:
          # post_build: