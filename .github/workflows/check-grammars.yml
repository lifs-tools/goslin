name: Check Grammars

on:
  # every push to master and every pull request, also those stacked on another branch
  push:
    branches: [ master ]
  pull_request:
  # manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check grammars
        # --continue reports every grammar with errors, not only the first
        run: ./gradlew build --continue
      - name: Generate railroad diagrams
        # docs/grammars/<Grammar>/<Grammar>.html, published to GitHub Pages by the next step
        run: ./gradlew railroadDiagrams --continue
      - name: Upload railroad diagrams
        uses: actions/upload-artifact@v7
        with:
          name: railroad-diagrams
          path: docs/grammars/
          if-no-files-found: error
      # converts the AsciiDoc files to HTML and publishes them to the gh-pages branch,
      # together with all other HTML files, including the generated railroad diagrams;
      # only on a push to master or a manual run, never from a pull request
      - name: asciidoctor-ghpages
        if: github.event_name != 'pull_request'
        uses: manoelcampos/asciidoctor-ghpages-action@v2
        with:
          pdf_build: false
          # asciidoctor_params: --attribute=nofooter
          # adoc_file_ext: .ascii # default is .adoc
          # source_dir: docs/ # default is .
          # slides_build: true
          # pre_build:
          # post_build:
