name: Lipid name not parsed or parsed wrongly
description: A lipid name that a Goslin grammar does not read, or reads wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a lipid name. Please give one name per line; several names of the same kind can go into one issue.
  - type: textarea
    id: names
    attributes:
      label: Lipid names
      description: The names exactly as written in your data, one per line.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: The normalised shorthand name you expect for each name, and the lipid class if you know it.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The error message, or the wrong name that was returned.
      render: text
  - type: input
    id: implementation
    attributes:
      label: Implementation and version
      description: For example "pygoslin 2.2.5", "jgoslin 2.2.1" or "web application".
    validations:
      required: true
  - type: dropdown
    id: grammar
    attributes:
      label: Grammar
      description: The grammar the name should be read with, if you know it.
      options:
        - Not sure
        - Shorthand2020
        - Goslin
        - LipidMaps
        - SwissLipids
        - HMDB
        - FattyAcids
        - Other
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Where the names come from, for example a database, a software tool or a publication (optional).
