plugins {
    id 'antlr'
}

repositories {
    mavenCentral()
}

dependencies {
    antlr "org.antlr:antlr4:4.13.2"
}
// grammars to include for checking
ext {
    grammars = [
    "FattyAcids.g4",
    "GoslinFragments.g4",
    "Goslin.g4",
    "HMDB.g4",
    "LipidMaps.g4",
    "Shorthand2020.g4",
    "SumFormula.g4",
    "SwissLipids.g4",
//    "Systematic.g4"
    ]
}

// one task per grammar, run by `check` (and so by `build`): ANTLR fails the task on a grammar error
grammars.each { grammar ->
    if (!file(grammar).isFile()) {
        throw new GradleException("Grammar '${grammar}' is listed in build.gradle but does not exist")
    }
    def grammarSource = objects.sourceDirectorySet(grammar, grammar)
    grammarSource.srcDir(".")
    grammarSource.include(grammar)
    def checkGrammar = tasks.register("antlr-${grammar}", AntlrTask) {
        group = 'verification'
        description = "Checks ${grammar} with ANTLR."
        source = grammarSource
        outputDirectory = layout.buildDirectory.dir("generated-src/antlr/${grammar}").get().asFile
        maxHeapSize = '1G'
        arguments = []
        doFirst { logger.lifecycle("Checking '${grammar}' with ANTLR") }
    }
    tasks.named('check') { dependsOn(checkGrammar) }
}
